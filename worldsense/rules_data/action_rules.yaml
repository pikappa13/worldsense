- id: destructive_file_action
  action_type: filesystem.delete
  keywords: ["delete", "remove", "cancella", "rm -rf"]
  risk_level: high
  side_effect_type: destructive
  reversible: false
  requires_confirmation: true
  requires_context: ["user_confirmation", "exact_target"]
  block_without_required_context: true
  should_warn: true
  reasons:
    - "File deletion can cause permanent data loss."
    - "The target must be explicit before proceeding."
  confirmation_prompt: "Please confirm the exact path to delete and that a backup is available."
  safer_alternative: "List matching files first or run a dry-run before deleting."

- id: shell_dangerous_command
  action_type: shell.run
  keywords: ["rm -rf", "format", "del /s", "chmod 777", "sudo"]
  risk_level: high
  side_effect_type: destructive_or_security_sensitive
  reversible: false
  requires_confirmation: true
  requires_context: ["user_confirmation", "command_reviewed"]
  block_without_required_context: true
  should_warn: true
  reasons:
    - "The command may modify or destroy data or weaken security."
    - "Dangerous shell commands require explicit review."
  confirmation_prompt: "Please confirm the command and target before execution."
  safer_alternative: "Use a dry-run, list-only command, or narrower target."

- id: send_external_email
  action_type: email.send
  keywords: ["send", "email", "mail", "invia"]
  risk_level: medium
  side_effect_type: external_side_effect
  reversible: false
  requires_confirmation: true
  requires_context: ["recipient", "draft_reviewed", "user_confirmation"]
  block_without_required_context: true
  should_warn: true
  reasons:
    - "Sending email is an external side effect and cannot be fully undone."
    - "Recipient and final content should be reviewed."
  confirmation_prompt: "Please review the recipient and final email text before I send it."
  safer_alternative: "Prepare a draft instead of sending immediately."

- id: financial_purchase
  action_type: purchase.create
  keywords: ["buy", "purchase", "compra", "pagamento"]
  risk_level: high
  side_effect_type: financial_action
  reversible: false
  requires_confirmation: true
  requires_context: ["budget", "user_confirmation"]
  block_without_required_context: true
  should_warn: true
  reasons:
    - "Purchases involve financial cost and may be hard to reverse."
  confirmation_prompt: "Please confirm the item, price, budget, and payment method."
  safer_alternative: "Compare options and ask for budget before purchasing."

- id: destructive_database_action
  action_type: database.query
  keywords: ["drop table", "truncate", "delete from", "drop database"]
  risk_level: critical
  side_effect_type: destructive
  reversible: false
  requires_confirmation: true
  requires_context: ["backup_available", "user_confirmation", "command_reviewed"]
  block_without_required_context: true
  should_warn: true
  reasons:
    - "Database destructive operations can cause production data loss."
    - "Backup, review, and explicit confirmation are required."
  confirmation_prompt: "Please confirm backup status, environment, and exact database command."
  safer_alternative: "Run a read-only query or transaction-wrapped dry-run first."

- id: calendar_bulk_update
  action_type: calendar.update
  keywords: ["cancel all", "delete all", "sposta tutti", "cancella tutti"]
  risk_level: medium
  side_effect_type: external_side_effect
  reversible: true
  requires_confirmation: true
  requires_context: ["user_confirmation"]
  block_without_required_context: true
  should_warn: true
  reasons:
    - "Bulk calendar changes can disrupt other people and schedules."
  confirmation_prompt: "Please confirm the affected events before I update the calendar."
  safer_alternative: "Show the list of events first."

- id: public_social_post
  action_type: social.post
  keywords: ["publish", "post", "pubblica"]
  risk_level: medium
  side_effect_type: public_communication
  reversible: false
  requires_confirmation: true
  requires_context: ["draft_reviewed", "user_confirmation"]
  block_without_required_context: true
  should_warn: true
  reasons:
    - "Public posts can create reputation and relationship risk."
  confirmation_prompt: "Please review the final public post and audience before publishing."
  safer_alternative: "Prepare a draft instead of publishing immediately."

- id: permissions_broad_write
  action_type: system.permissions
  keywords: ["chmod 777", "grant all", "everyone full control"]
  risk_level: high
  side_effect_type: security_sensitive
  reversible: true
  requires_confirmation: true
  requires_context: ["command_reviewed", "user_confirmation"]
  block_without_required_context: true
  should_warn: true
  reasons:
    - "Broad permissions can weaken security."
  confirmation_prompt: "Please confirm the exact permission change and target path."
  safer_alternative: "Grant the narrowest required permission to a specific user or group."
