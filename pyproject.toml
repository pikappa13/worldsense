[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "worldsense"
version = "0.1.0"
description = "A reality-check layer for AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "WorldSense contributors" }
]
keywords = [
  "ai-agents",
  "safety",
  "risk-assessment",
  "common-sense",
  "llm",
  "tool-use"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
  "pydantic>=2.7",
  "PyYAML>=6.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5"
]

[project.scripts]
worldsense = "worldsense.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["worldsense"]

[tool.hatch.build.targets.sdist]
include = [
  "/worldsense",
  "/benchmark",
  "/data",
  "/docs",
  "/examples",
  "/tests",
  "/README.md",
  "/CONTRIBUTING.md",
  "/SECURITY.md",
  "/CODE_OF_CONDUCT.md",
  "/LICENSE",
  "/pyproject.toml"
]

[tool.hatch.build.targets.wheel.force-include]
"data/seed_scenarios.jsonl" = "worldsense/data/seed_scenarios.jsonl"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
