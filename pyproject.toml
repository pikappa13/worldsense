[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "worldsense"
version = "0.1.0"
description = "Reality-check layer for AI agents — risk detection, action gating, consequence simulation, MCP tool for Claude Code and Cursor."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "WorldSense contributors" }
]
keywords = [
  "ai-agents",
  "ai-safety",
  "llm-safety",
  "agent-safety",
  "risk-assessment",
  "risk-detection",
  "guardrails",
  "common-sense",
  "consequence-simulation",
  "action-gating",
  "mcp",
  "mcp-server",
  "mcp-tool",
  "claude-code",
  "llm",
  "llm-guardrails",
  "responsible-ai",
  "tool-use",
  "openai",
  "anthropic"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
  "pydantic>=2.7",
  "PyYAML>=6.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5"
]
claude = [
  "anthropic>=0.40"
]
openai = [
  "openai>=1.50"
]
ollama = [
  "ollama>=0.3"
]
all-adapters = [
  "anthropic>=0.40",
  "openai>=1.50",
  "ollama>=0.3"
]

[project.urls]
Homepage = "https://github.com/pikappa13/worldsense"
Repository = "https://github.com/pikappa13/worldsense"
Issues = "https://github.com/pikappa13/worldsense/issues"

[project.scripts]
worldsense = "worldsense.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["worldsense"]

[tool.hatch.build.targets.sdist]
include = [
  "/worldsense",
  "/benchmark",
  "/data",
  "/docs",
  "/examples",
  "/tests",
  "/README.md",
  "/CONTRIBUTING.md",
  "/SECURITY.md",
  "/CODE_OF_CONDUCT.md",
  "/LICENSE",
  "/pyproject.toml"
]

[tool.hatch.build.targets.wheel.force-include]
"data/seed_scenarios.jsonl" = "worldsense/data/seed_scenarios.jsonl"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
